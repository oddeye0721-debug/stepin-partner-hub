<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>STEPIN 파트너 허브 · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: 좌측 고정 내비 + 우측 작업 영역(뷰 단위 전환). 무대 바닥의 '플레이 위치 표시' 테이프를 모티프로 한 마젠타·시안 2색 체계 */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --sunk:#E9EBF4; --ink:#15162B; --muted:#5A5E7A; --line:#D9DCEA;
  --accent:#D61F73; --accent-ink:#FFFFFF; --accent-soft:#FCE4EF; --cyan:#00879E; --cyan-soft:#DDF4F7;
  --ok:#1E8A55; --ok-soft:#E1F3EA; --warn:#B26A00; --warn-soft:#FBEFD9; --bad:#C2352B; --bad-soft:#FBE3E1;
  --gate:#0C0D1A; --gate-ink:#F2F2FA;
  --f-display:"Unbounded","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --nav-w:264px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F1C; --surface:#171829; --sunk:#1F2136; --ink:#ECEDF8; --muted:#A0A3BE; --line:#2C2E48;
  --accent:#FF4F9C; --accent-ink:#1A0A12; --accent-soft:#3A1529; --cyan:#43DDEE; --cyan-soft:#10313A;
  --ok:#53D394; --ok-soft:#123426; --warn:#F2B44C; --warn-soft:#3A2A0F; --bad:#FF7A70; --bad-soft:#3E1714;
  --gate:#08090F; --gate-ink:#F2F2FA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F1C; --surface:#171829; --sunk:#1F2136; --ink:#ECEDF8; --muted:#A0A3BE; --line:#2C2E48;
  --accent:#FF4F9C; --accent-ink:#1A0A12; --accent-soft:#3A1529; --cyan:#43DDEE; --cyan-soft:#10313A;
  --ok:#53D394; --ok-soft:#123426; --warn:#F2B44C; --warn-soft:#3A2A0F; --bad:#FF7A70; --bad-soft:#3E1714;
  --gate:#08090F; --gate-ink:#F2F2FA; color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- GATE ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--gate);color:var(--gate-ink);display:grid;grid-template-columns:1.1fr 1fr;overflow:auto}
#gate .gv{position:relative;min-height:100%;background:#000 center/cover no-repeat url("img/keyvisual_arcade_motion.jpg")}
#gate .gv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,15,0) 40%,var(--gate) 100%)}
#gate .gf{display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:520px}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand .tape{display:inline-block;width:26px;height:26px;border-radius:7px;background:conic-gradient(from 200deg,#FF4F9C,#7B5CFF,#43DDEE,#FF4F9C)}
#gate h1{font-family:var(--f-body);font-size:clamp(26px,3.4vw,34px);font-weight:700}
#gate .lead{color:#B9BBD4;max-width:42ch}
#gate form{display:flex;flex-direction:column;gap:10px}
#gate label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9EA1BE;font-family:var(--f-display)}
.code-row{display:flex;gap:8px}
#codeInput{flex:1;min-width:0;background:#141526;border:1.5px solid #34365A;border-radius:10px;color:#fff;font-family:var(--f-mono);font-size:18px;letter-spacing:.08em;padding:14px 16px;text-transform:uppercase}
#codeInput:focus{border-color:#43DDEE;outline:none}
#codeBtn{background:#FF4F9C;color:#1A0A12;border:0;border-radius:10px;padding:0 20px;font-weight:700}
#codeMsg{min-height:1.4em;font-size:13px;color:#FF9C95}
#gate .small{font-size:12.5px;color:#8E91AE}
#gate .small b{color:#D6D8EE;font-weight:600}
@media (max-width:820px){#gate{grid-template-columns:1fr}#gate .gv{min-height:220px}#gate .gv::after{background:linear-gradient(180deg,rgba(8,9,15,0) 30%,var(--gate) 100%)}}

/* ---------- SHELL ---------- */
#app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100%}
nav#side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
nav#side .brand{font-size:15px;padding:4px 8px}
nav#side .brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp h6{margin:0 0 4px;padding:0 10px;font-family:var(--f-display);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.navgrp a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14.5px}
.navgrp a .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:20px}
.navgrp a:hover{background:var(--sunk)}
.navgrp a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navgrp a[aria-current="page"] .k{color:var(--accent)}
.whoami{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.whoami b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;font-size:13px;text-align:left}

header#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center}
#menuBtn{display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:600}
.search{position:relative;flex:1;max-width:520px}
#q{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 38px;font:inherit;color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,10,30,.18);max-height:60vh;overflow:auto;padding:6px}
#results button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:7px}
#results button:hover,#results button:focus{background:var(--sunk)}
#results small{display:block;color:var(--muted);font-size:12px}
.top-meta{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
main{min-width:0}
.view{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
@media (min-width:900px){.view{padding-left:40px;padding-right:40px}}
@media (max-width:999px){
  #app{grid-template-columns:1fr}
  nav#side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(300px,86vw);z-index:70;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.3);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  body.nav-open nav#side{transform:none}
  body.nav-open #scrim{display:block}
  #menuBtn{display:inline-block}
  .top-meta{display:none}
}
#scrim{display:none;position:fixed;inset:0;background:rgba(5,5,15,.45);z-index:65}

/* ---------- CONTENT ---------- */
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.vh{display:flex;flex-direction:column;gap:10px}
.vh h1{font-size:clamp(24px,3vw,32px);font-weight:700}
.vh p{color:var(--muted);max-width:68ch}
h2.sec{font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:10px;scroll-margin-top:90px}
h2.sec .tag{font-family:var(--f-mono);font-size:12px;color:var(--cyan);font-weight:600}
h3{font-size:16.5px;font-weight:700;scroll-margin-top:90px}
.block{display:flex;flex-direction:column;gap:14px}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid>*{min-width:0}
ul.list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
ul.list li::marker{color:var(--accent)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps>li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px}
ol.steps>li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;margin-top:1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.k{font-weight:600;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-req{background:var(--accent-soft);color:var(--accent)}
.p-rec{background:var(--cyan-soft);color:var(--cyan)}
.p-opt{background:var(--sunk);color:var(--muted)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.note{border-left:3px solid var(--cyan);background:var(--cyan-soft);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.hot{border-color:var(--accent);background:var(--accent-soft)}
.note b{font-weight:700}
.src{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabpanel{display:flex;flex-direction:column;gap:26px;padding-top:4px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;border-radius:14px;overflow:hidden;background:var(--gate);color:var(--gate-ink)}
.hero .hc{padding:30px 28px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero h1{font-size:clamp(24px,3vw,32px);font-weight:700}
.hero p{color:#BFC1DA;max-width:46ch}
.hero .hi{background:#000 center 30%/cover no-repeat url("img/keyvisual_stepin_score.jpg");min-height:240px}
.hero .eyebrow{color:#FF7DB5}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .hi{min-height:180px;order:-1}}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;counter-reset:f}
.flow a{position:relative;text-decoration:none;color:var(--ink);padding:14px 12px 14px 14px;border-top:3px solid var(--line);display:flex;flex-direction:column;gap:4px}
.flow a:hover{border-color:var(--accent)}
.flow .d{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.flow b{font-size:14.5px}
.flow span{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qcard{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.qcard:hover{border-color:var(--accent)}
.qcard .k{font-family:var(--f-mono);font-size:12px;color:var(--cyan)}
.qcard b{font-size:16px}
.qcard span{font-size:13.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.facts .v{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.facts .l{font-size:12.5px;color:var(--muted)}

/* status chain */
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .st{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:5px 9px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.chain .st.live{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chain .ar{color:var(--muted);font-size:12px}

/* ruler signature */
.ruler{position:relative;height:74px;border-radius:10px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%) ,var(--surface);border:1px solid var(--line);overflow:hidden}
.ruler .zone{position:absolute;top:0;bottom:0;left:73.3%;width:10%;background:var(--accent-soft);border-left:2px dashed var(--accent);border-right:2px dashed var(--accent)}
.ruler .dev{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--ink)}
.ruler .lab{position:absolute;bottom:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted);transform:translateX(-50%)}
.ruler .zl{position:absolute;top:8px;left:78.3%;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.ruler .dl{position:absolute;top:8px;left:18px;font-size:12px;font-weight:600}

/* diagrams */
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px}
.diagram svg{display:block;min-width:640px;width:100%;height:auto}
svg .n{fill:var(--sunk);stroke:var(--line);stroke-width:1.2}
svg .n.arc{fill:var(--accent-soft);stroke:var(--accent)}
svg .n.ctl{fill:var(--cyan-soft);stroke:var(--cyan)}
svg .n.out{fill:var(--surface);stroke:var(--ink)}
svg .t{fill:var(--ink);font-family:var(--f-body);font-size:13px;font-weight:600}
svg .ts{fill:var(--muted);font-family:var(--f-body);font-size:11px}
svg .e{stroke:var(--muted);stroke-width:1.6;fill:none}
svg .e.hd{stroke:var(--accent)}
svg .e.net{stroke:var(--cyan);stroke-dasharray:5 4}
svg .el{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
svg .ah{fill:var(--muted)}
svg .ah.hd{fill:var(--accent)}
svg .ah.net{fill:var(--cyan)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--muted);vertical-align:middle;margin-right:6px}
.legend i.hd{border-color:var(--accent)} .legend i.net{border-top:2px dashed var(--cyan)}

/* broadcast type cards */
.typesel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.typesel button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.typesel button b{font-size:14.5px}
.typesel button span{font-size:12px;color:var(--muted)}
.typesel button .k{font-family:var(--f-mono);font-size:11px;color:var(--cyan)}
.typesel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:760px){.typesel{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* figure */
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figure img{border-radius:8px;border:1px solid var(--line);background:var(--sunk);display:block}
figcaption{font-size:12.5px;color:var(--muted)}

/* compare */
.vs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.vs{grid-template-columns:1fr}}
.vs .panel{display:flex;flex-direction:column;gap:12px}
.vs h3{display:flex;gap:8px;align-items:center}
.pc{display:flex;flex-direction:column;gap:6px;font-size:14px}
.pc li{list-style:none;padding-left:22px;position:relative}
.pc li::before{position:absolute;left:0;top:0;font-family:var(--f-mono);font-weight:700}
.pc.pro li::before{content:"+";color:var(--ok)}
.pc.con li::before{content:"−";color:var(--bad)}
.pc ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stat{display:flex;flex-direction:column;gap:4px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em}
.stat .v small{font-size:14px;font-family:var(--f-body);color:var(--muted);font-weight:500;margin-left:4px}
.stat p{font-size:13.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#recOut{display:flex;flex-direction:column;gap:8px}

/* assets */
.vlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.vitem{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vitem .play{width:46px;height:46px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.vitem .play::after{content:"";border-left:13px solid var(--bg);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.vitem b{font-size:14px;display:block}
.vitem small{color:var(--muted);font-size:12.5px;display:block}
.vitem .cat{font-family:var(--f-mono);font-size:11px;color:var(--cyan)}
.vitem>div{min-width:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gitem{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.gitem .ph{aspect-ratio:4/5;background:var(--sunk) center/contain no-repeat;max-width:100%}
.gitem .meta{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.gitem b{font-size:13.5px}
.gitem small{font-size:12px;color:var(--muted)}
.gitem .row{margin-top:auto}
.dlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ditem{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ditem:last-child{border-bottom:0}
.ditem .ext{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1.5px solid var(--ink);border-radius:6px;padding:8px 0;text-align:center}
.ditem b{display:block;font-size:14.5px}
.ditem small{color:var(--muted);font-size:12.5px}
@media (max-width:560px){.ditem{grid-template-columns:44px minmax(0,1fr)}.ditem .act{grid-column:2}}

/* checklist */
.ck-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.ck-prog{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.ck-phase{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ck-phase>header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sunk)}
.ck-phase>header .d{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:13px;min-width:54px}
.ck-phase>header b{flex:1}
.ck-phase>header small{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.ck-item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.ck-item input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.ck-item.done span{color:var(--muted);text-decoration:line-through}
.ck-item .who{font-size:11.5px}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px}

/* mc */
.script{display:flex;flex-direction:column;gap:10px}
.sline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sline b{font-size:14px;display:flex;gap:8px;align-items:center}
.sline p{font-size:14.5px;margin-top:4px}
.star{color:var(--accent);font-family:var(--f-mono);font-size:12px}

/* faq */
details.qa{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.qa+details.qa{margin-top:8px}
details.qa summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;gap:10px}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"Q";font-family:var(--f-mono);color:var(--accent)}
details.qa[open] summary{border-bottom:1px solid var(--line)}
details.qa .a{padding:12px 16px 14px 38px;font-size:14.5px;color:var(--ink)}
.faq-cat{font-family:var(--f-mono);font-size:11px;color:var(--cyan);margin-left:auto;white-space:nowrap}
#faqFilter{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;color:var(--ink)}

/* contact */
.ccard{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ccard .k{font-size:12.5px;color:var(--muted)}
.ccard .v{font-family:var(--f-mono);font-size:15px;font-weight:600;word-break:break-all;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* admin */
.admin-enter{background:none;border:1.5px solid #43DDEE;color:#43DDEE;border-radius:10px;padding:10px 14px;font-weight:600;align-self:flex-start}
.adm-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.adm-state{font-size:13px;color:var(--muted)}
.adm-state.dirty{color:var(--warn);font-weight:600}
.adm-list{display:flex;flex-direction:column;gap:10px}
.adm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.adm-row.off{opacity:.55}
.adm-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.adm-fields>*{min-width:0}
.adm-fields .wide{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:11.5px;color:var(--muted);font-weight:600}
.fld input,.fld textarea,.fld select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink)}
.fld textarea{min-height:72px;resize:vertical}
.adm-ops{display:flex;flex-direction:column;gap:6px}
.adm-ops button{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px}
.adm-ops button.del{color:var(--bad)}
.newcode{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border:1.5px dashed var(--accent);border-radius:10px;background:var(--accent-soft)}
.newcode .v{font-family:var(--f-mono);font-size:18px;font-weight:600;letter-spacing:.06em;user-select:all}
.log{font-size:13px;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.log div{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
footer.foot{border-top:1px solid var(--line);padding-top:18px;font-size:12.5px;color:var(--muted)}
</style><style>
.adm-login{color:#B9BBD4;font-size:13.5px}
.adm-login summary{cursor:pointer;color:#43DDEE;font-weight:600}
.adm-login form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
#adminPw{flex:1;min-width:0;background:#141526;border:1.5px solid #34365A;border-radius:10px;color:#fff;font-size:16px;padding:12px 14px}
#adminBtn{background:#43DDEE;color:#08090F;border:0;border-radius:10px;padding:0 18px;font-weight:700}
#adminMsg{min-height:1.2em;font-size:13px;color:#FF9C95}
</style>
</head>
<body>
<div id="gate">
  <div class="gv" aria-hidden="true"></div>
  <div class="gf">
    <div class="brand"><span class="tape" aria-hidden="true"></span>STEPIN PARTNER HUB</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <h1 id="gateTitle">STEPIN 대회 파트너 가이드</h1>
      <p class="lead">싸이드워크와 협업해 STEPIN 대회를 운영하는 파트너를 위한 운영 가이드입니다. 본사에서 발급받은 파트너 코드를 입력해 주세요.</p>
    </div>
    <form id="gateForm" autocomplete="off">
      <label for="codeInput">Partner Code</label>
      <div class="code-row">
        <input id="codeInput" name="code" placeholder="STP-XXX-0000" spellcheck="false" aria-describedby="codeMsg">
        <button id="codeBtn" type="submit">입장</button>
      </div>
      <div id="codeMsg" role="status"></div>
    </form>
    <details class="adm-login"><summary>본사 관리자 로그인</summary>
      <form id="adminForm" autocomplete="off">
        <label for="adminPw">Admin Password</label>
        <div class="code-row"><input id="adminPw" type="password" placeholder="관리자 비밀번호"><button id="adminBtn" type="submit">로그인</button></div>
        <div id="adminMsg" role="status"></div>
      </form>
    </details>
    <p class="small">코드가 없거나 분실한 경우 본사 IMC팀에 발급을 요청해 주세요.<br><b>070-4117-0113</b> · <b>marketing@sidewalkplay.com</b></p>
  </div>
</div>

<script>
(function(){
const q=new URLSearchParams(location.search);
if(q.get("expired"))document.getElementById("codeMsg").textContent="코드 사용이 중지되었거나 로그인이 만료되었습니다. 본사에 문의해 주세요.";
async function post(url,data){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),credentials:"same-origin"});let d={};try{d=await r.json()}catch(e){}return [r.ok,d]}
document.getElementById("gateForm").addEventListener("submit",async e=>{
  e.preventDefault();const msg=document.getElementById("codeMsg"),btn=document.getElementById("codeBtn");
  const code=document.getElementById("codeInput").value.trim();
  if(!code){msg.textContent="파트너 코드를 입력해 주세요.";return}
  btn.disabled=true;msg.textContent="확인 중…";
  try{const [ok,d]=await post("/api/login",{code});if(ok){location.href="/"}else{msg.textContent=d.error||"로그인하지 못했습니다.";document.getElementById("codeInput").select()}}
  catch(err){msg.textContent="서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요."}
  finally{btn.disabled=false}
});
document.getElementById("adminForm").addEventListener("submit",async e=>{
  e.preventDefault();const msg=document.getElementById("adminMsg"),btn=document.getElementById("adminBtn");
  btn.disabled=true;msg.textContent="확인 중…";
  try{const [ok,d]=await post("/api/admin/login",{password:document.getElementById("adminPw").value});if(ok){location.href="/#admin"}else{msg.textContent=d.error||"로그인하지 못했습니다."}}
  catch(err){msg.textContent="서버에 연결하지 못했습니다."}
  finally{btn.disabled=false}
});
document.getElementById("codeInput").focus();
})();
</script>
</body>
</html>
